<svg xmlns="http://www.w3.org/2000/svg" width="800" height="176" viewBox="0 0 800 176">
<defs>
  <!-- COULEURS : fond de la carte (haut-gauche → bas-droite) -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/>
    <stop offset="1" stop-color="#2a0c10"/>
  </linearGradient>
  <!-- COULEURS : bordure -->
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#da3633"/>
    <stop offset="0.5" stop-color="#ff7b72" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#da3633"/>
  </linearGradient>
  <!-- REFLET : bande blanche (0.16 = intensité) -->
  <linearGradient id="shine2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <!-- COULEURS : lueur dans le coin bas-droite -->
  <radialGradient id="glow" cx="0.9" cy="0.95" r="0.6">
    <stop offset="0" stop-color="#da3633" stop-opacity="0.38"/>
    <stop offset="1" stop-color="#da3633" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="card"><rect x="2" y="2" width="796" height="172" rx="16"/></clipPath>
</defs>

<style>
  .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
  .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
</style>

<!-- CARTE : fond + bordure (rx = arrondi des coins) -->
<rect x="2" y="2" width="796" height="172" rx="16" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>

<g clip-path="url(#card)">
  <rect width="800" height="176" fill="url(#glow)"/>

  <!-- REFLET ANIMÉ : dur="5s" = durée d'un cycle (plus petit = plus rapide) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-320 0;1000 0;1000 0" keyTimes="0;0.55;1" dur="5s"
      repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.25 1;0 0 1 1"/>
    <polygon points="0,0 110,0 -50,176 -160,176" fill="url(#shine2)"/>
    <polygon points="130,0 150,0 -10,176 -30,176" fill="url(#shine2)"/>
  </g>

  <!-- Pulsation de la lueur -->
  <rect width="800" height="176" fill="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="2" y="2" width="796" height="1.5" fill="#fff" opacity="0.14"/>
</g>

<!-- MONOGRAMME : change "YK" pour tes initiales -->
<g transform="translate(36,36)">
  <rect width="68" height="68" rx="16" fill="#da3633" fill-opacity="0.15" stroke="#ff7b72" stroke-opacity="0.6"/>
  <text x="34" y="44" text-anchor="middle" class="mono" font-size="28" font-weight="700" fill="#ff7b72">YK</text>
</g>

<!-- TEXTES (x = position horizontale, y = position verticale, font-size = taille) -->
<text x="124" y="54"  class="mono" font-size="13" fill="#ff7b72">$ whoami</text>
<text x="124" y="88"  class="sans" font-size="32" font-weight="700" fill="#e6edf3">Yasmine Khirallah</text>
<text x="124" y="113" class="sans" font-size="15" fill="#9da7b3">Junior Cybersecurity Engineer</text>
<text x="124" y="140" class="mono" font-size="13" font-weight="700" fill="#ff7b72">IAM · SOC · DevSecOps</text>
</svg>
